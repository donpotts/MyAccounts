name: Build and deploy .NET Core application to Web App myaccounts
on:
  push:
    branches:
    - main
env:
  AZURE_WEBAPP_NAME: myaccounts
  AZURE_WEBAPP_PACKAGE_PATH: MyAccounts\publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: MyAccounts
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build with version from run number
      run: |
        $version = "1.0.${{ github.run_number }}"
        Write-Host "Building version: $version"
        dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore /p:Version=$version /p:AssemblyVersion=$version.0 /p:FileVersion=$version.0
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish with version from run number
      run: |
        $version = "1.0.${{ github.run_number }}"
        dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" /p:Version=$version /p:AssemblyVersion=$version.0 /p:FileVersion=$version.0
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.myaccounts_2287 }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
