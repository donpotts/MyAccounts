    <script>
        // Version checking - fetches the service worker assets manifest to detect new versions
        (function() {
            let currentVersion = null;
            
            async function checkForUpdates() {
                try {
                    // Fetch the service worker assets with cache-busting
                    const response = await fetch('/service-worker-assets.js?v=' + Date.now(), { 
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    
                    if (response.ok) {
                        const text = await response.text();
                        // Extract version from the assets manifest
                        const versionMatch = text.match(/"version":\s*"([^"]+)"/);
                        if (versionMatch) {
                            const serverVersion = versionMatch[1];
                            console.log('Server version:', serverVersion, 'Current version:', currentVersion);
                            
                            if (currentVersion === null) {
                                // First check - store the version
                                currentVersion = serverVersion;
                                console.log('Initial version set to:', currentVersion);
                            } else if (currentVersion !== serverVersion) {
                                // Version changed - reload
                                console.log('New version detected! Reloading...');
                                
                                // Clear caches before reloading
                                if ('caches' in window) {
                                    const keys = await caches.keys();
                                    await Promise.all(keys.map(key => caches.delete(key)));
                                    console.log('Caches cleared');
                                }
                                
                                // Force reload from server
                                window.location.reload(true);
                            }
                        }
                    }
                } catch (error) {
                    console.log('Version check failed:', error);
                }
            }
            
            // Check for updates on page load
            checkForUpdates();
            
            // Check for updates every 60 seconds
            setInterval(checkForUpdates, 60 * 1000);
        })();
    </script>
    <script>
        // Service worker registration with auto-update
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').then(function (registration) {
                console.log('Service worker registered');
                
                // Check for updates immediately
                registration.update();
                
                // Check for updates every 60 seconds
                setInterval(() => registration.update(), 60 * 1000);

                registration.onupdatefound = function () {
                    console.log('Service worker update found');
                    const installingWorker = registration.installing;
                    
                    installingWorker.onstatechange = function () {
                        if (installingWorker.state === 'installed') {
                            if (navigator.serviceWorker.controller) {
                                console.log('New service worker installed, triggering skip waiting');
                                installingWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        }
                    };
                };
            }).catch(function(error) {
                console.log('Service worker registration failed:', error);
            });

            // Listen for controller change and reload
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!refreshing) {
                    refreshing = true;
                    console.log('Controller changed, reloading...');
                    window.location.reload();
                }
            });
        }
    </script>
    <script>
        window.downloadFileFromStream = (fileName, base64) => {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], {
                type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };


        window.downloadFromBase64 = function (base64, filename) {
            var a = document.createElement("a");
            document.body.appendChild(a);
            a.style = "display: none";
            var byteCharacters = atob(base64);
            var byteNumbers = new Array(byteCharacters.length);
            for (var i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            var byteArray = new Uint8Array(byteNumbers);
            var blob = new Blob([byteArray], { type: "application/octet-stream" });
            var url = window.URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        };
    </script>
